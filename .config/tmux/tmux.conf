# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# split panes using | and -, make sure they open in the same path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.config/tmux/tmux.conf

# unbind p
# bind p previous-window

# shorten command delay
set -sg escape-time 1

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Use Alt-h and Alt-l without prefix key to switch windows
bind -n M-j previous-window
bind -n M-k next-window

# enable vi mode keys
set-window-option -g mode-keys vi

# 在 copy mode 中使用 'v' 开始选择
bind -T copy-mode-vi v send-keys -X begin-selection

# 使用 'y' 复制选中的内容并同步到 macOS 系统剪贴板，随后自动退出复制模式
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# 鼠标拖拽选中文本后自动复制到系统剪贴板（不用按键）
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# set default terminal mode to 256 colors
# set -g default-terminal "screen-256color"

# 推荐使用 tmux-256color，兼容性更好
set -g default-terminal "tmux-256color"

# 告诉 tmux 当前终端（如 Kitty 或 iTerm）支持真色彩 (Tc/RGB)
set -ag terminal-overrides ",xterm-256color:RGB"
# 如果你主要用 Kitty，也可以加上这一行确保万无一失
set -ag terminal-overrides ",xterm-kitty:RGB"

# present a menu of URLs to open from the visible pane. sweet.
bind u capture-pane \;\
    save-buffer /tmp/tmux-buffer \;\
    split-window -l 10 "urlview /tmp/tmux-buffer"


######################
### DESIGN CHANGES ###
######################

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour1 bg=colour18 bold'

# panes
set -g pane-border-style 'fg=colour19 bg=colour0'
set -g pane-active-border-style 'bg=colour0 fg=colour5'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour18 fg=colour4'
set -g status-left ''
set -g status-right '#[fg=colour18,bg=colour4] %d/%m #[fg=colour4,bg=colour18] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style 'fg=colour1 bg=colour19 bold'
setw -g window-status-current-format ' #I #[fg=colour7]#W#[fg=colour8]#F '

setw -g window-status-style 'fg=colour1 bg=colour18 dim'
setw -g window-status-format ' #I #[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'

# messages
set -g message-style 'fg=colour18 bg=colour4 bold'

# -------------------------
# Tmux 插件管理
# -------------------------
# 显式指定插件的安装目录，保持家目录整洁
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
# 将 resurrect 存档目录修改为现代 XDG 规范路径
set -g @resurrect-dir '~/.config/tmux/resurrect'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'laktak/extrakto'
# 会话保存与恢复插件
set -g @plugin 'tmux-plugins/tmux-resurrect'
# 开启保存窗格内容功能
set -g @resurrect-capture-pane-contents 'on'
# 每次保存完成后，自动查找并删除 15 天前的历史存档
set -g @resurrect-hook-post-save-all 'find ~/.config/tmux/resurrect -name "*.txt" -mmin +60 -delete'

set -g @plugin 'tmux-plugins/tmux-continuum'
# 开启自动恢复
set -g @continuum-restore 'on'

# 初始化 TPM (必须放在文件最底部)
run '~/.config/tmux/plugins/tpm/tpm'
